services:
  # Backend API + cellery
  - type: web
    name: tms-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && chmod +x start.sh && ./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tms-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: tms-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: OSRM_URL
        value: http://router.project-osrm.org  
      - key: ROUTING_BACKEND
        value: osrm
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: tms-redis
          property: connectionString
      - key: DEPOT_OPEN_HOUR
        value: 6
      - key: DEPOT_CLOSE_HOUR
        value: 20
      - key: DEPOT_LAT
        value: 18.0735
      - key: DEPOT_LON
        value: -15.9582

  # Frontend (Static Site)
  - type: web
    name: tms-frontend
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tms-backend.onrender.com/api/v1

databases:
  # PostgreSQL 
  - name: tms-db
    databaseName: tms_db
    user: postgres
    plan: free

  # Redis 
  - name: tms-redis
    plan: free
    maxmemoryPolicy: noeviction
