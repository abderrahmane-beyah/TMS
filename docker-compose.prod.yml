services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tms-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: tms-prod-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OSRM (Mauritania routing)
  osrm:
    image: osrm/osrm-backend:latest
    container_name: tms-prod-osrm
    platform: linux/amd64
    ports:
      - "5001:5000"
    volumes:
      - ./backend/osrm-data:/data
    command: osrm-routed --algorithm mld /data/mauritania-latest.osrm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend (FastAPI + Celery)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms-prod-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tms_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      OSRM_URL: http://osrm:5000
      ROUTING_BACKEND: ${ROUTING_BACKEND:-osrm}
      GOOGLE_MAPS_API_KEY : ${GOOGLE_MAPS_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    container_name: tms-prod-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
